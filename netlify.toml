# West Austin Lightworks — static deploy. No build step.
# Publish the repo root; Netlify serves index.html and detects the quote form
# from its data-netlify attribute at deploy time.

[build]
  publish = "."

# Fingerprint-stable assets (images, fonts) can be cached hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Sensible defaults for everything else.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
